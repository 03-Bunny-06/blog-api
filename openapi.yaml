openapi: 3.0.0
info:
  title: Blog API Documentation
  version: 1.0.0
  description: | 
      A robust RESTful blog backend service built with Node.js, Express, and MongoDB, offering secure authentication, role-based access, full blog CRUD operations, favorites management, and interactive Swagger documentation.

      🚀 **Key Features**: 
        - **Secure Authentication:** JWT-based authentication for users and admins.
        - **Role-Based Access:** Admin and user routes with permission controls.
        - **Blog CRUD Operations:** Create, read, update, delete blog posts with pagination and filters.
        - **Favorites System:** Users can add and view favorite blogs.
      
      🛠 **Tech Stack**: 
        - **Node.js:** JavaScript runtime for server-side logic. 
        - **Express.js:** Lightweight REST API framework handling routing and HTTP requests.
        - **MongoDB & Mongoose:** NoSQL database and ODM for storage and schema modeling.
        - **JWT & Swagger (OpenAPI):** JSON Web Tokens for secure sessions and Swagger for API documentation.
  contact: 
    name: Sai Kowshik 
    email: saikowshik0306@gmail.com 
    url: https://github.com/03-Bunny-06/blog-api
servers:
  - url: https://api-blog-management.onrender.com
tags:
  - name: Admin
  - name: Users
  - name: Non-Existing Routes
security: 
