info:
  title: Blog API Documentation
  version: 1.0.0
  description: | 
    Blog API is a RESTful backend service for modern blogging platforms.

    🚀 **Features**: 
      - User authentication and authorization. 
      - Blog post creation, editing, and deletion. 
      - Secure and scalable REST endpoints. 
      - Clean and scalable API architecture. 
    
    🛠 **Tech Stack**: 
      - Node.js, Express.js & Mongo DB. 
      - REST API principles. 
      - JWT-based authentication. 
      - Modular and maintainable codebase.
  contact: 
    name: Sai Kowshik 
    email: saikowshik0306@gmail.com 
    url: https://github.com/03-Bunny-06/blog-api
servers:
