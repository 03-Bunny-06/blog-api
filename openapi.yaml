components:
  securitySchemes:
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        🔐 **Admin Authorization**

        - Use an **Admin JWT token.**
        - Paste the token in the **Authorize** button.
        - _Note: Do not attach the Bearer in this only use the (raw token)_
        - Format must be exactly only the _(raw token)_: 
        `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImFkbWluMDEiLCJpYXQiOjE3NzE1MjI3NDh9.iO63ObRy28pplN5acb9c4qhtAPkAcnqLs9xCvSA3ex4`
    UserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        🔐 **User Authorization**

        - Use an **User JWT token.**
        - Paste the token in the **Authorize** button.
        - _Note: Do not attach the Bearer in this only use the (raw token)_
        - Format must be exactly only the _(raw token)_:
        `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6InVzZXIwMSIsImlhdCI6MTc3MTU2NTIzN30.IDRJgePk3aW2BTipbMC7Ni30F5afeCNuX18LG4up-88`